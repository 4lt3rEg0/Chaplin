name: Build Android APK

# CHAPLIN MOBILE ALPHA — builds the debug APK on GitHub's own runners instead
# of locally. The local machine hit a persistent, unresolved Windows-level
# Java NIO socket bug (Gradle daemon's loopback Selector failing) that survived
# three different JDKs, disabling VPN/virtual network adapters, a full reboot,
# and a Winsock reset — none of which are reproducible or relevant on a clean
# GitHub-hosted runner, so this sidesteps the problem entirely.

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/web/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: chaplin-debug-apk
          path: frontend/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
