<!DOCTYPE html>
<html>
<head>
    <title>Chaplin Y2K</title>
    <style>
        body {
            background: #0a0a0f;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #00ff88;
            padding: 20px;
            box-shadow: 0 0 30px #00ff88;
        }
        h1 {
            text-shadow: 0 0 10px #00ff88;
            font-family: 'Orbitron', sans-serif;
        }
        .api-response {
            background: rgba(0,255,136,0.1);
            padding: 15px;
            border: 1px solid #00ff88;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 CHAPLIN Y2K SOCIAL</h1>
        <div id="api-data" class="api-response">Cargando...</div>
        <button onclick="loadData()">Cargar Posts</button>
        <button onclick="loadRadio()">Cargar Radio</button>
        <div id="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';

        async function loadData() {
            const response = await fetch(API_URL + '/posts/');
            const posts = await response.json();
            document.getElementById('result').innerHTML =
                `<pre>${JSON.stringify(posts, null, 2)}</pre>`;
        }

        async function loadRadio() {
            const response = await fetch(API_URL + '/radio/stations');
            const radio = await response.json();
            document.getElementById('result').innerHTML =
                `<pre>${JSON.stringify(radio, null, 2)}</pre>`;
        }

        // Cargar info inicial
        fetch('http://localhost:8000/')
            .then(r => r.json())
            .then(data => {
                document.getElementById('api-data').innerHTML =
                    `<strong>${data.message}</strong><br>
                     Versión: ${data.version}<br>
                     Tags: ${data.default_tags.join(', ')}`;
            });
    </script>
</body>
</html>
